const container = document.getElementById('scripts');
let currentDay = 0;

scripts.forEach((s, i) => {
  if (s.day !== currentDay) {
    currentDay = s.day;
    const dayLabel = document.createElement('div');
    dayLabel.className = 'day-label';
    const dayScripts = scripts.filter(x => x.day === currentDay).map(x => '#' + x.num).join(', ');
    const dayCount = scripts.filter(x => x.day === currentDay).length;
    dayLabel.textContent = `DAY ${currentDay} — ${dayCount} scripts (${dayScripts})`;
    container.appendChild(dayLabel);
  }

  const card = document.createElement('div');
  card.className = 'script-card';
  card.innerHTML = `
    <div class="script-header">
      <span class="script-num">#${s.num}</span>
      <span class="script-title">${s.title}</span>
      <div class="script-meta">
        <span class="badge badge-hook">${s.hook}</span>
        <span class="badge badge-dur">${s.dur}</span>
      </div>
    </div>
    <div class="script-body">
      <div class="section">
        <div class="section-label">3-Layer Hook</div>
        <div class="hook-grid">
          <div class="hook-item"><em>Audio:</em> ${s.hooks.audio}</div>
          <div class="hook-item"><em>Text on Screen:</em> ${s.hooks.text}</div>
          <div class="hook-item"><em>Visual:</em> ${s.hooks.visual}</div>
        </div>
      </div>
      <div class="section">
        <div class="section-label">Caption</div>
        <div class="caption-box">${s.caption}<br><span class="hashtags">${s.hashtags}</span></div>
      </div>
      <div class="section">
        <div class="section-label">Teleprompter Script</div>
        <div class="script-text">${s.script}</div>
      </div>
      <div class="section">
        <div class="section-label">CTA</div>
        <div class="cta-box">${s.cta}</div>
      </div>
    </div>
  `;

  card.querySelector('.script-header').addEventListener('click', () => {
    const wasActive = card.classList.contains('active');
    document.querySelectorAll('.script-card').forEach(c => c.classList.remove('active'));
    if (!wasActive) card.classList.add('active');
  });

  container.appendChild(card);
});
</script>
